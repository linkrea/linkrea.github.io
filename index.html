<script>
// ==================== Particle Background ====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2 + 1;
        this.opacity = Math.random() * 0.5 + 0.1;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(96, 165, 250, ${this.opacity})`;
        ctx.fill();
    }
}

for (let i = 0; i < 60; i++) particles.push(new Particle());

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(96, 165, 250, ${0.1 * (1 - dist/150)})`;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();

// ==================== Empty Data Structure ====================
const emptyData = {
    about: { title: '关于我们', subtitle: '', content: '', stats: [] },
    news: [],
    team: [],
    projects: []
};

// ==================== GitHub Data Store ====================
const store = {
    data: JSON.parse(JSON.stringify(emptyData)),
    github: { token: '', owner: '', repo: '', path: 'data.json' },
    dataLoaded: false,
    isLoading: false,

    async init() {
        // 1. 尝试从同域读取 data.json（无需 Token，因为 GitHub Pages 是公开的）
        try {
            const res = await fetch('./data.json', { cache: 'no-store' });
            if (res.ok) {
                const loaded = await res.json();
                this.data = loaded;
                this.dataLoaded = true;
            }
        } catch(e) {
            // data.json 不存在或读取失败，保持空结构
        }

        // 2. 加载 GitHub 配置（用于写入）
        const gh = localStorage.getItem('ccn_github');
        if (gh) this.github = JSON.parse(gh);
    },

    isConfigured() {
        return this.github.token && this.github.owner && this.github.repo;
    },

    saveConfig() {
        localStorage.setItem('ccn_github', JSON.stringify(this.github));
    },

    clearConfig() {
        this.github = { token: '', owner: '', repo: '', path: 'data.json' };
        localStorage.removeItem('ccn_github');
    },

    getApiUrl() {
        return `https://api.github.com/repos/${this.github.owner}/${this.github.repo}/contents/${this.github.path}`;
    },

    async syncToGitHub() {
        if (!this.isConfigured()) throw new Error('GitHub 未配置');
        this.isLoading = true;
        try {
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(this.data, null, 2))));
            const apiUrl = this.getApiUrl();
            let sha = '';
            try {
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${this.github.token}` } });
                if (getRes.ok) { const fileData = await getRes.json(); sha = fileData.sha; }
            } catch(e) {}
            const body = { message: 'Update data via admin panel', content, branch: 'main' };
            if (sha) body.sha = sha;
            const res = await fetch(apiUrl, {
                method: 'PUT',
                headers: { 'Authorization': `token ${this.github.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error('同步失败: ' + await res.text());
            return true;
        } finally {
            this.isLoading = false;
        }
    },

    async loadFromGitHub() {
        if (!this.isConfigured()) throw new Error('GitHub 未配置');
        this.isLoading = true;
        try {
            const apiUrl = this.getApiUrl();
            const res = await fetch(apiUrl, { headers: { 'Authorization': `token ${this.github.token}` } });
            if (res.status === 404) {
                await this.syncToGitHub();
                return { created: true };
            }
            if (!res.ok) throw new Error('加载失败: ' + await res.text());
            const fileData = await res.json();
            const content = decodeURIComponent(escape(atob(fileData.content)));
            this.data = JSON.parse(content);
            this.dataLoaded = true;
            return { created: false };
        } finally {
            this.isLoading = false;
        }
    }
};

// ==================== Toast ====================
function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-yellow-500' };
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
    toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 min-w-[200px]`;
    toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ==================== Router ====================
const router = {
    currentRoute: 'home',
    navigate(route) {
        this.currentRoute = route;
        window.location.hash = route;
        this.render();
        window.scrollTo(0, 0);
    },
    render() {
        const app = document.getElementById('app');
        const route = window.location.hash.slice(1) || 'home';
        this.currentRoute = route;
        switch(route) {
            case 'home': app.innerHTML = renderHome(); break;
            case 'about': app.innerHTML = renderAbout(); break;
            case 'news': app.innerHTML = renderNews(); break;
            case 'team': app.innerHTML = renderTeam(); break;
            case 'projects': app.innerHTML = renderProjects(); break;
            case 'admin': app.innerHTML = renderAdmin(); break;
            default: app.innerHTML = renderHome();
        }
        document.querySelectorAll('.nav-link').forEach(el => {
            const isActive = el.dataset.route === route || (route === '' && el.dataset.route === 'home');
            el.classList.toggle('active', isActive);
            el.classList.toggle('text-blue-400', isActive);
        });
    }
};

function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('hidden');
}

// ==================== Empty State Helper ====================
function emptyState(icon, title, subtitle) {

    <div class="glass rounded-xl p-12 text-center">
        <i class="fas ${icon} text-4xl text-gray-600 mb-4"></i>
        <h3 class="text-lg font-bold text-gray-400 mb-2">${title}</h3>
        <p class="text-sm text-gray-600">${subtitle}</p>
    </div>`;
}

// ==================== Frontend Views ====================
function renderHome() {
    const hasStats = store.data.about && store.data.about.stats && store.data.about.stats.length > 0;
    const hasNews = store.data.news && store.data.news.length > 0;
    const hasProjects = store.data.projects && store.data.projects.length > 0;

    return `
    <div class="animate-fade-in">
        <section class="relative min-h-[90vh] flex items-center justify-center overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-blue-900/20 via-transparent to-primary"></div>
            <div class="relative z-10 text-center px-4 max-w-5xl mx-auto">
                <div class="inline-flex items-center space-x-2 px-4 py-2 rounded-full glass mb-6 animate-float">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span class="text-sm text-blue-300">团队持续招新中</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold mb-6 leading-tight">
                    <span class="text-gradient">云计算</span>与<span class="text-gradient">算力网络</span><br>
                    <span class="text-3xl md:text-5xl text-gray-300">前沿技术研发团队</span>
                </h1>
                <p class="text-lg md:text-xl text-gray-400 mb-10 max-w-2xl mx-auto leading-relaxed">
                    构建下一代网络基础设施，让算力像水电一样便捷可得
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="router.navigate('projects')" class="btn-primary px-8 py-3 rounded-lg font-medium text-white">
                        <i class="fas fa-rocket mr-2"></i>探索研发项目
                    </button>
                    <button onclick="router.navigate('about')" class="px-8 py-3 rounded-lg font-medium border border-white/20 hover:bg-white/5 transition text-white">
                        <i class="fas fa-info-circle mr-2"></i>了解团队
                    </button>
                </div>
                ${hasStats ? `
                <div class="mt-16 grid grid-cols-2 md:grid-cols-4 gap-6 max-w-3xl mx-auto">
                    ${store.data.about.stats.map(s => `
                        <div class="glass rounded-xl p-4 text-center card-hover">
                            <i class="fas ${s.icon} text-2xl text-blue-400 mb-2"></i>
                            <div class="text-2xl font-bold text-white">${s.value}</div>
                            <div class="text-xs text-gray-400 mt-1">${s.label}</div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}
            </div>
        </section>

        ${hasNews ? `
        <section class="max-w-7xl mx-auto px-4 py-20">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-gradient mb-2">最新动态</h2>
                    <p class="text-gray-400">团队最新研究成果与合作进展</p>
                </div>
                <button onclick="router.navigate('news')" class="text-blue-400 hover:text-blue-300 text-sm font-medium">
                    查看全部 <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
            <div class="grid md:grid-cols-3 gap-6">
                ${store.data.news.slice(0, 3).map(n => `
                    <div class="glass rounded-xl overflow-hidden card-hover cursor-pointer" onclick="router.navigate('news')">
                        <div class="h-48 bg-cover bg-center" style="background-image: url('${n.image || ''}')"></div>
                        <div class="p-5">
                            <div class="flex items-center space-x-2 mb-3">
                                <span class="px-2 py-1 rounded text-xs bg-blue-500/20 text-blue-300">${n.category || '未分类'}</span>
                                <span class="text-xs text-gray-500">${n.date || ''}</span>
                            </div>
                            <h3 class="font-bold text-lg mb-2 line-clamp-2">${n.title}</h3>
                            <p class="text-sm text-gray-400 line-clamp-2">${n.summary || ''}</p>
                        </div>
                    </div>
                `).join('')}
            </div>
        </section>
        ` : ''}

        ${hasProjects ? `
        <section class="max-w-7xl mx-auto px-4 py-20">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-gradient mb-2">重点研发项目</h2>
                    <p class="text-gray-400">聚焦算力网络核心技术攻关</p>
                </div>
                <button onclick="router.navigate('projects')" class="text-blue-400 hover:text-blue-300 text-sm font-medium">
                    查看全部 <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${store.data.projects.slice(0, 3).map(p => `
                    <div class="glass rounded-xl overflow-hidden card-hover">
                        <div class="h-40 bg-cover bg-center" style="background-image: url('${p.image || ''}')"></div>
                        <div class="p-5">
                            <div class="flex items-center justify-between mb-3">
                                <span class="px-2 py-1 rounded text-xs ${p.status === '已完成' ? 'bg-green-500/20 text-green-300' : 'bg-blue-500/20 text-blue-300'}">${p.status || '进行中'}</span>
                                <span class="text-xs text-gray-500">${p.progress || 0}%</span>
                            </div>
                            <h3 class="font-bold text-lg mb-2">${p.title}</h3>
                            <p class="text-sm text-gray-400 line-clamp-2 mb-4">${p.description || ''}</p>
                            <div class="w-full bg-gray-700 rounded-full h-2">

                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>

        ` : ''}
    </div>`;
}

function renderAbout() {
    const about = store.data.about || { title: '关于我们', subtitle: '', content: '', stats: [] };
    const hasContent = about.content && about.content.trim();
    const hasStats = about.stats && about.stats.length > 0;

    return `
    <div class="animate-fade-in max-w-5xl mx-auto px-4 py-12">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold text-gradient mb-4">${about.title || '关于我们'}</h1>
            <p class="text-xl text-gray-400">${about.subtitle || ''}</p>
        </div>
        ${hasContent ? `
        <div class="glass rounded-2xl p-8 md:p-12 mb-12">
            <div class="max-w-none">
                ${about.content.split('\n').filter(p => p.trim()).map(p => `<p class="text-gray-300 leading-relaxed mb-4 text-lg">${p}</p>`).join('')}
            </div>
        </div>
        ` : emptyState('fa-info-circle', '暂无内容', '管理员可在后台编辑关于我们页面')}
        ${hasStats ? `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            ${about.stats.map(s => `
                <div class="glass rounded-xl p-6 text-center card-hover">
                    <i class="fas ${s.icon} text-3xl text-blue-400 mb-3"></i>
                    <div class="text-3xl font-bold text-white mb-1">${s.value}</div>
                    <div class="text-sm text-gray-400">${s.label}</div>
                </div>
            `).join('')}
        </div>
        ` : ''}
    </div>`;
}

function renderNews() {
    const hasNews = store.data.news && store.data.news.length > 0;

    return `
    <div class="animate-fade-in max-w-6xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gradient mb-4">新闻动态</h1>
            <p class="text-gray-400">团队最新研究成果、学术活动与合作进展</p>
        </div>
        ${hasNews ? `
        <div class="space-y-6">
            ${store.data.news.map(n => `
                <div class="glass rounded-xl overflow-hidden card-hover flex flex-col md:flex-row">
                    <div class="md:w-1/3 h-48 md:h-auto bg-cover bg-center" style="background-image: url('${n.image || ''}')"></div>
                    <div class="p-6 md:w-2/3 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center space-x-3 mb-3">
                                <span class="px-3 py-1 rounded-full text-xs bg-blue-500/20 text-blue-300">${n.category || '未分类'}</span>

function checkAdminLogin() {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        router.render();
        showToast('登录成功');
    } else {
        showToast('密码错误', 'error');
    }
}

function adminLogout() {
    isAdminLoggedIn = false;
    router.navigate('home');
    showToast('已退出登录');
}

    adminTab = tab;

function resetConfig() {
    if (!confirm('确定要清除 GitHub 配置吗？此操作不会删除 GitHub 上的数据。')) return;
    store.clearConfig();
    router.render();
    showToast('配置已清除');
}

                    <div><label class="block text-sm text-gray-400 mb-1">日期</label><input type="date" id="f_date" value="${item?.date || new Date().toISOString().split('T')[0]}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                </div>
                <div><label class="block text-sm text-gray-400 mb-1">封面图片 URL</label><input type="text" id="f_image" value="${item?.image || ''}" placeholder="https://..." class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">摘要</label><textarea id="f_summary" rows="2" class="admin-input w-full px-3 py-2 rounded text-white text-sm">${item?.summary || ''}</textarea></div>
                <div><label class="block text-sm text-gray-400 mb-1">详细内容</label><textarea id="f_content" rows="4" class="admin-input w-full px-3 py-2 rounded text-white text-sm">${item?.content || ''}</textarea></div>
            </div>`;
    } else if (type === 'team') {
        fields = `
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm text-gray-400 mb-1">姓名</label><input type="text" id="f_name" value="${item?.name || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                    <div><label class="block text-sm text-gray-400 mb-1">职称</label><input type="text" id="f_title" value="${item?.title || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                </div>
                <div><label class="block text-sm text-gray-400 mb-1">头像 URL</label><input type="text" id="f_photo" value="${item?.photo || ''}" placeholder="https://..." class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">研究方向（用顿号分隔）</label><input type="text" id="f_research" value="${item?.research || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">邮箱</label><input type="email" id="f_email" value="${item?.email || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">个人简介</label><textarea id="f_bio" rows="3" class="admin-input w-full px-3 py-2 rounded text-white text-sm">${item?.bio || ''}</textarea></div>
            </div>`;
    } else if (type === 'projects') {
        fields = `
            <div class="space-y-4">
                <div><label class="block text-sm text-gray-400 mb-1">项目名称</label><input type="text" id="f_title" value="${item?.title || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">项目描述</label><textarea id="f_description" rows="2" class="admin-input w-full px-3 py-2 rounded text-white text-sm">${item?.description || ''}</textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm text-gray-400 mb-1">负责人</label><input type="text" id="f_leader" value="${item?.leader || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                    <div><label class="block text-sm text-gray-400 mb-1">状态</label>
                        <select id="f_status" class="admin-input w-full px-3 py-2 rounded text-white text-sm">
                            <option value="进行中" ${item?.status === '进行中' ? 'selected' : ''}>进行中</option>
                            <option value="已完成" ${item?.status === '已完成' ? 'selected' : ''}>已完成</option>
                            <option value="规划中" ${item?.status === '规划中' ? 'selected' : ''}>规划中</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-sm text-gray-400 mb-1">开始时间</label><input type="month" id="f_startDate" value="${item?.startDate || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                    <div><label class="block text-sm text-gray-400 mb-1">结束时间</label><input type="month" id="f_endDate" value="${item?.endDate || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                </div>
                <div><label class="block text-sm text-gray-400 mb-1">进度 (%)</label><input type="number" id="f_progress" value="${item?.progress || 0}" min="0" max="100" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">封面图片 URL</label><input type="text" id="f_image" value="${item?.image || ''}" placeholder="https://..." class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
                <div><label class="block text-sm text-gray-400 mb-1">标签（用逗号分隔）</label><input type="text" id="f_tags" value="${item?.tags?.join(',') || ''}" class="admin-input w-full px-3 py-2 rounded text-white text-sm"></div>
            </div>`;
    }

    const modal = document.createElement('div');
    modal.id = 'editModal';
    modal.className = 'fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4';
    modal.innerHTML = `
        <div class="glass-strong rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-slide-up">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xl font-bold">${id ? '编辑' : '新增'}${type === 'news' ? '新闻' : type === 'team' ? '成员' : '项目'}</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6">${fields}</div>
            <div class="p-6 border-t border-white/5 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-white/5 transition">取消</button>
                <button onclick="saveItem()" class="btn-primary px-6 py-2 rounded-lg text-sm text-white"><i class="fas fa-save mr-2"></i>保存</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
}

function closeModal() {
    const modal = document.getElementById('editModal');
    if (modal) modal.remove();
    editingId = null;
    editingType = null;
}

async function saveItem() {
    const type = editingType;
    const id = editingId;

    let newItem = { id: id || Date.now() };

    if (type === 'news') {
        newItem.title = document.getElementById('f_title').value;
        newItem.category = document.getElementById('f_category').value;
        newItem.date = document.getElementById('f_date').value;
        newItem.image = document.getElementById('f_image').value;
        newItem.summary = document.getElementById('f_summary').value;
        newItem.content = document.getElementById('f_content').value;
    } else if (type === 'team') {
        newItem.name = document.getElementById('f_name').value;
        newItem.title = document.getElementById('f_title').value;
        newItem.photo = document.getElementById('f_photo').value;
        newItem.research = document.getElementById('f_research').value;
        newItem.email = document.getElementById('f_email').value;
        newItem.bio = document.getElementById('f_bio').value;
    } else if (type === 'projects') {
        newItem.title = document.getElementById('f_title').value;
        newItem.description = document.getElementById('f_description').value;
        newItem.leader = document.getElementById('f_leader').value;
        newItem.status = document.getElementById('f_status').value;
        newItem.startDate = document.getElementById('f_startDate').value;
        newItem.endDate = document.getElementById('f_endDate').value;
        newItem.progress = parseInt(document.getElementById('f_progress').value) || 0;
        newItem.image = document.getElementById('f_image').value;
        newItem.tags = document.getElementById('f_tags').value.split(',').map(t => t.trim()).filter(t => t);
    }

    if (!newItem.title) {
        showToast('标题不能为空', 'error');
        return;
    }

    if (id) {
        const idx = store.data[type].findIndex(x => x.id === id);
        if (idx !== -1) store.data[type][idx] = newItem;
    } else {
        store.data[type].push(newItem);
    }

    closeModal();
    router.render();

    if (store.isConfigured()) {
        showToast('正在推送至 GitHub...', 'info');
        try {
            await store.syncToGitHub();
            store.dataLoaded = true;
            showToast(id ? '修改已同步至 GitHub' : '添加已同步至 GitHub');
        } catch(e) {
            showToast('GitHub 同步失败: ' + e.message, 'error');
        }
    } else {
        showToast('已保存（未配置 GitHub，刷新后数据将丢失）', 'warning');
    }
}

function editItem(type, id) {
    openModal(type, id);
}

async function deleteItem(type, id) {
    if (!confirm('确定要删除这条记录吗？此操作不可恢复。')) return;
    store.data[type] = store.data[type].filter(x => x.id !== id);
    router.render();

    if (store.isConfigured()) {
        showToast('正在推送至 GitHub...', 'info');
        try {
            await store.syncToGitHub();
            showToast('删除已同步至 GitHub');
        } catch(e) {
            showToast('GitHub 同步失败: ' + e.message, 'error');
        }
    } else {
        showToast('已删除（未配置 GitHub，刷新后数据将丢失）', 'warning');
    }
}

async function saveAbout() {
    if (!store.data.about) store.data.about = { title: '', subtitle: '', content: '', stats: [] };
    store.data.about.title = document.getElementById('aboutTitle').value;
    store.data.about.subtitle = document.getElementById('aboutSubtitle').value;
    store.data.about.content = document.getElementById('aboutContent').value;

    if (store.isConfigured()) {
        showToast('正在推送至 GitHub...', 'info');
        try {
            await store.syncToGitHub();
            store.dataLoaded = true;
            showToast('保存已同步至 GitHub');
        } catch(e) {
            showToast('GitHub 同步失败: ' + e.message, 'error');
        }
    } else {
        showToast('已保存（未配置 GitHub，刷新后数据将丢失）', 'warning');
    }
}

function saveGitHubConfig() {
    store.github.token = document.getElementById('ghToken').value;
    store.github.owner = document.getElementById('ghOwner').value;
    store.github.repo = document.getElementById('ghRepo').value;
    store.saveConfig();
    router.render();
    showToast('配置已保存');
}

async function syncToGitHub() {
    showToast('正在推送至 GitHub...', 'info');
    try {
        await store.syncToGitHub();
        store.dataLoaded = true;
        showToast('已成功推送至 GitHub');
    } catch(e) {
        showToast(e.message, 'error');
    }
}

async function loadFromGitHub() {
    showToast('正在从 GitHub 拉取...', 'info');
    try {
        await store.loadFromGitHub();
        router.render();
        showToast('已成功从 GitHub 拉取数据');
    } catch(e) {
        showToast(e.message, 'error');
    }
}

// ==================== Init ====================
window.addEventListener('hashchange', () => router.render());
window.addEventListener('DOMContentLoaded', async () => {
    await store.init();
    router.render();
});
</script>
</body>
</html>
